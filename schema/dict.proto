syntax = "proto3";

option php_namespace = "Proto";
option go_package = "/proto;proto";

//
// ======
// 枚举字典
// ======
//

message Dict {
  // ULID
  string id = 1;

  // 枚举名称
  string name = 2;

  // 枚举代码
  string code = 3;

  //所属Module，为空时属于App下
  string module_id = 4;

  // 枚举选项
  repeated Option options = 5;
}

//
// ======
// 枚举选项
// ======
//

message Option {
  // ULID
  string id = 1;

  // 枚举选项名称
  string name = 2;

  // 枚举选项代码
  string code = 3;
}
